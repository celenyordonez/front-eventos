<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Palestrante</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Sistema de Eventos</h1>

        <nav>
            <a href="editarEventos.html">Eventos</a>
            <a href="cadastrarEvento.html">Cadastrar Evento</a>
            <a href="cadastroPalestrante.html">Cadastrar Palestrante</a>
        </nav>
    </header>

    <main>

        <div class="formulario">

            <h2>Cadastrar Palestrante</h2>

            <form id="formPalestrante">

                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <button type="submit">
                    Cadastrar Palestrante
                </button>

            </form>

        </div>

    </main>

    <script src="js/palestrante.js"></script>

</body>
</html>
