<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Evento</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Sistema de Eventos</h1>

        <nav>
            <a href="editarEventos.html">Eventos</a>
            <a href="cadastrarEvento.html">Cadastrar Evento</a>
            <a href="cadastroPalestrante.html">Cadastrar Palestrante</a>
        </nav>
    </header>

    <main>

        <div class="formulario">

            <h2 id="tituloFormulario">Cadastrar Evento</h2>

            <form id="formEvento">

                <label for="nome">Nome do evento</label>
                <input
                    type="text"
                    id="nome"
                    required
                >

                <label for="descricao">Descrição</label>
                <textarea
                    id="descricao"
                    required
                ></textarea>

                <label for="local">Local</label>
                <input
                    type="text"
                    id="local"
                    required
                >

                <label for="palestrantes">Palestrante</label>
                <select id="palestrantes" required>
                    <option value="">Selecione um palestrante</option>
                </select>

                <button type="submit">
                    Cadastrar Evento
                </button>

            </form>

        </div>

    </main>

    <script src="js/evento.js"></script>

</body>
</html>
